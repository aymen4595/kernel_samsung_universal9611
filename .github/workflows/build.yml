name: Build Kernel A51 Direct Force

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. On génère la config de base
          make vendor/a51_defconfig
          
          # 2. On désactive la sécurité qui bloque le démarrage du build
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          
          # 3. COMPILATION ULTRA-TOLÉRANTE
          # On passe les drapeaux d'ignorance directement dans la commande make
          # -w : ignore les warnings
          # -fpermissive : ignore les erreurs de code "sale"
          # KCFLAGS s'occupe des drivers Samsung sans modifier les fichiers manuellement
          make -j$(nproc) KCFLAGS="-w -fpermissive -Wno-error"
