name: Build Kernel A51 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev clang lld llvm

      - name: Download Toolchain
        run: git clone --depth=1 "https://github.com" toolchain

      - name: Compile Kernel
        run: |
          export PATH=$(pwd)/toolchain/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          # Nettoyage automatique des erreurs Samsung
          find drivers/media/platform/exynos/ -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i 's/#define warn_common.*/#define warn_common(fmt, ...) do {} while(0)/g' {} +
          find drivers/media/platform/exynos/ -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i 's/#define fimc_is_warn.*/#define fimc_is_warn(fmt, ...) do {} while(0)/g' {} +

          make vendor/a51_defconfig
          make -j$(nproc) CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-A51-Final
          path: arch/arm64/boot/Image.gz-dtb
