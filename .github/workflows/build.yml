name: Build Kernel A51 GCC49

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev
          git clone https://github.com toolchain --depth=1

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          
          # Nettoyage Samsung
          for f in $(find drivers/media/platform/exynos/ -name "*.h" -o -name "*.c"); do
            sed -i 's/#define warn_common.*/#define warn_common(fmt, ...) do {} while(0)/g' "$f"
            sed -i 's/#define fimc_is_warn.*/#define fimc_is_warn(fmt, ...) do {} while(0)/g' "$f"
          done

          make vendor/a51_defconfig
          
          {
            echo "CONFIG_VIDEO_V4L2=y"
            echo "CONFIG_VIDEOBUF2_CORE=y"
            echo "CONFIG_VIDEOBUF2_MEMOPS=y"
            echo "CONFIG_VIDEOBUF2_VMALLOC=y"
            echo "CONFIG_VIDEO_V4L2_LOOPBACK=y"
          } >> .config
          
          make olddefconfig
          make -j$(nproc)

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: boot-image-gcc49
          path: arch/arm64/boot/Image.gz-dtb
