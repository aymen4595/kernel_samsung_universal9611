name: Build Kernel A51 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev clang lld llvm

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 1. Nettoyage Samsung
          for f in $(find drivers/media/platform/exynos/ -type f \( -name "*.h" -o -name "*.c" \)); do
            sed -i 's/#define warn_common.*/#define warn_common(fmt, ...) do {} while(0)/g' "$f"
            sed -i 's/#define fimc_is_warn.*/#define fimc_is_warn(fmt, ...) do {} while(0)/g' "$f"
          done

          # 2. FIX KernelSU : On commente la ligne qui fait planter le build
          sed -i 's/source "drivers\/android\/kernelsu\/Kconfig"/# /g' drivers/android/Kconfig

          # 3. Configuration et Build
          make vendor/a51_defconfig
          make -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-A51
          path: arch/arm64/boot/Image.gz-dtb
