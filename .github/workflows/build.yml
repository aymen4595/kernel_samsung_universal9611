name: Build Kernel A51 Final Base

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. On désactive KernelSU pour éviter l'erreur de fichier manquant
          if [ -f drivers/android/Kconfig ]; then
            sed -i 's/source "drivers\/android\/kernelsu\/Kconfig"/# /g' drivers/android/Kconfig
          fi
          
          # 2. On génère la config
          make vendor/a51_defconfig
          
          # 3. ON FORCE L'IGNORANCE DES ERREURS (Le secret pour passer les 8min)
          sed -i 's/-Werror//g' Makefile
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          
          make olddefconfig
          
          # 4. Compilation "Force Brute"
          # On ignore les warnings (-w) et on autorise le code sale (-fpermissive)
          make -j$(nproc) KCFLAGS="-w -fpermissive"
